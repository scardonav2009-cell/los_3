<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Comunidad UAM</title>
  <link rel="stylesheet" href="registro.css">
</head>
<body>
    
    <div class="left-section">
      <div class="banner-text">
        <span class="yellow">HOY MÁS QUE</span><br>
        <span class="blue">NUNCA, SOMOS</span><br>
        <span class="red">COMUNIDAD UAM</span>
      </div>
    </div>

    
    <div class="right-section">
      <h2 class="form-title">
        <span class="title-yellow">Regis</span><span class="title-red">tro</span>
      </h2>

      <form action="#" method="POST">
        <div class="form-group">
          <label for="correo">Correo institucional:</label>
          <input type="email" id="correo" name="correo" placeholder="ejemplo@autonoma.edu.co" required>
        </div>

        <div class="form-group">
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input type="password" id="password" name="password" placeholder="Contraseña" required>
        </div>

        <div class="form-group">
          <label for="documento">Documento:</label>
          <input type="text" id="documento" name="documento" placeholder="Número de documento" required>
        </div>

        <button type="submit" class="btn-submit">
          <span class="btn-text-yellow">Regis</span><span class="btn-text-red">trarse</span>
        </button>
      </form>
    </div>
  </div>

</body>
</html>
